# ينشر مجلد app وحده كجذر للموقع، فتبقى المسارات النسبية في الملفات صحيحة.
name: نشر التطبيق

on:
  push:
    branches: [main]
    # نبضة الإبقاء تعدّل هذا الملف فقط، ولا داعي لإعادة نشر بسببها
    paths-ignore:
      - '.github/heartbeat.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: فحص المنطق قبل النشر
        run: node tools/test.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app

      - id: deployment
        uses: actions/deploy-pages@v5
